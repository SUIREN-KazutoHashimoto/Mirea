name: Verify Mirea
on:
  push:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Already published beta release, for example v0.15.0beta
        required: true
        type: string
permissions:
  contents: read
jobs:
  web-and-api:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux media runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:startup
      - run: pnpm test:package
  container:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: mirea-ci-${{ github.run_id }}-${{ github.run_attempt }}
      MIREA_IMAGE: mirea:ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - run: docker compose build --build-arg VCS_REF=${{ github.sha }}
      - name: Verify the unprivileged sandbox with TrueNAS GUI security defaults
        run: node scripts/check-container-sandbox.mjs
      - run: docker compose up -d --wait
      - run: curl --fail http://localhost:3000/
      - name: Verify video and audio conversion inside the read-only container
        run: docker compose run --rm --no-deps -T mirea /usr/local/bin/node --input-type=module < scripts/check-media-runtime.mjs
      - name: Create isolated accounts, nested series, PDF, progress and encrypted download
        run: node scripts/check-container.mjs prepare
      - run: docker compose up -d --force-recreate --wait
      - name: Verify data and encryption identity after container recreation
        run: node scripts/check-container.mjs verify
      - name: Verify separate storage across a real filesystem boundary
        # Exercise the formerly broken stdin launcher too: file workers must
        # support inherited --input-type without dropping runtime permissions.
        run: docker compose run --rm --no-deps -e MIREA_EXPECT_CROSS_DEVICE=1 -e MIREA_STORAGE_FIXTURE_ROOT=/data -T mirea /usr/local/bin/node --input-type=module < scripts/check-storage-runtime.mjs
      - name: Verify opt-in persistent media volume and recreation
        run: |
          docker compose down
          export COMPOSE_PROJECT_NAME="${COMPOSE_PROJECT_NAME}-separated"
          docker compose -f compose.yaml -f compose.storage.yaml up -d --wait
          node scripts/check-container.mjs prepare
          docker compose -f compose.yaml -f compose.storage.yaml up -d --force-recreate --wait
          node scripts/check-container.mjs verify
      - name: Validate deployment configurations
        run: |
          docker compose -f compose.release.yaml config --quiet
          docker compose -f compose.yaml -f compose.host-data.yaml config --quiet
          docker compose -f compose.release.yaml -f compose.storage.yaml config --quiet
          docker compose -f deploy/truenas/compose.yaml config --quiet
      - name: Export exactly the tested image for a release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: docker save mirea:ci | gzip -n > "$RUNNER_TEMP/mirea-container-tested.tar.gz"
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: mirea-container-tested
          path: ${{ runner.temp }}/mirea-container-tested.tar.gz
          retention-days: 3
          compression-level: 0
      - if: always()
        run: |
          docker compose down
          COMPOSE_PROJECT_NAME="${COMPOSE_PROJECT_NAME}-separated" docker compose -f compose.yaml -f compose.storage.yaml down
  android:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm android:sync
      - run: bash ./gradlew testDebugUnitTest lintDebug assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: mirea-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
  publish-container:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [web-and-api, container, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - uses: actions/download-artifact@v4
        with:
          name: mirea-container-tested
          path: ${{ runner.temp }}
      - name: Publish the verified image and attach it to a draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/publish-container.mjs
      - if: always()
        run: docker logout ghcr.io
  promote-beta-channel:
    if: github.repository == 'SUIREN-KazutoHashimoto/Mirea' && (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop'))
    runs-on: ubuntu-latest
    concurrency:
      group: mirea-beta-channel
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Test publication policy
        run: node --test tests/container-channel.test.js
      - name: Promote only the exact image of the latest published verified beta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/publish-container-channel.mjs
