name: Verify Mirea
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  web-and-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux media runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:startup
      - run: pnpm test:package
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - run: docker compose up -d --wait
      - run: curl --fail http://localhost:3000/api/health
      - run: curl --fail http://localhost:3000/
      - name: Verify MPEG-TS conversion inside the read-only container
        run: docker compose exec -T mirea node --input-type=module < scripts/check-media-runtime.mjs
      - run: docker compose -f compose.yaml -f compose.host-data.yaml config --quiet
      - if: always()
        run: docker compose down
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm android:sync
      - run: bash ./gradlew testDebugUnitTest lintDebug assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: mirea-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
