name: Publish released beta channel
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Already published beta release, for example v0.15.0beta
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: mirea-beta-channel
  cancel-in-progress: false
jobs:
  promote:
    if: github.repository == 'SUIREN-KazutoHashimoto/Mirea' && (github.event_name == 'release' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Test publication policy
        run: node --test tests/container-channel.test.js
      - name: Promote only the exact image of the latest published verified beta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/publish-container-channel.mjs
